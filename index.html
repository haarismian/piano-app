<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comp — piano for accompanying singers</title>
<meta name="theme-color" content="#12141a">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23111'/><rect x='5' y='7' width='5' height='18' fill='%23fff'/><rect x='11' y='7' width='5' height='18' fill='%23fff'/><rect x='17' y='7' width='5' height='18' fill='%23fff'/><rect x='23' y='7' width='4' height='18' fill='%23fff'/><rect x='8.5' y='7' width='3' height='11' fill='%23111'/><rect x='14.5' y='7' width='3' height='11' fill='%23111'/><rect x='21' y='7' width='3' height='11' fill='%23111'/></svg>">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <span>Comp</span>
  </div>
  <div class="nextline" id="nextline"></div>
  <nav class="tabs" id="tabs">
    <button data-view="today" class="on">Today</button>
    <button data-view="path">Path</button>
    <button data-view="ref">Reference</button>
    <button data-view="progress">Progress</button>
  </nav>
</header>

<main id="main"></main>

<div class="metbar" id="metbar" hidden>
  <button id="met-toggle" class="mini">Start click</button>
  <input type="range" id="met-bpm" min="40" max="160" step="1" value="80">
  <output id="met-out">80</output>
  <span class="metbar-label">bpm</span>
  <button id="met-close" class="mini ghost" title="Hide metronome">&times;</button>
</div>

<script src="js/theory.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/audio.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/store.js"></script>
<script src="js/session.js"></script>
<script src="js/app.js"></script>
</body>
</html>
